name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Package build output
        run: |
          mkdir -p release
          tar -czf release/icalendar-${GITHUB_REF_NAME}.tgz dist README.md LICENSE package.json docs assets

      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/icalendar-${GITHUB_REF_NAME}.tgz \
            --generate-notes
