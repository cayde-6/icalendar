name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # Before installing anything: a tag that doesn't match package.json's
      # version is always a mistake (forgot to bump, or bumped and forgot to
      # tag) — fail immediately rather than after a full verify + build.
      - name: Check tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Pack tarball
        run: |
          mkdir -p release
          npm pack --pack-destination release

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: release-tarball
          path: release/*.tgz

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Only this job needs write access: publishing to npm (Trusted
    # Publishing via OIDC) and creating the GitHub release.
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Download tarball
        uses: actions/download-artifact@v8
        with:
          name: release-tarball
          path: release

      # Re-runs may encounter a version published by an earlier attempt.
      # Only skip publishing if its integrity matches our verified tarball.
      - name: Check whether this version is already published
        id: published
        # 0 = published and identical, 1 = absent, anything else = stop.
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          set +e
          node .github/scripts/npm-published.mjs "$name" "$version" ./release/*.tgz
          code=$?
          set -e
          case "$code" in
            0) echo "already=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "already=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "npm-published.mjs exited with unexpected code $code — failing closed" >&2
              exit 1
              ;;
          esac

      - name: Publish to npm
        if: steps.published.outputs.already == 'false'
        # A bare `release/*.tgz` is ambiguous to npm's package-arg parser
        # (it can be read as GitHub shorthand `owner/repo`) — the leading
        # `./` is required for it to be treated as a local tarball path.
        run: npm publish --access public --provenance ./release/*.tgz

      - name: Skip publish (already on npm)
        if: steps.published.outputs.already == 'true'
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          echo "::notice::$name@$version is already published on npm — skipping npm publish"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/*.tgz --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              release/*.tgz \
              --generate-notes \
              --verify-tag
          fi
