name: Smoke iCloud CalDAV

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      CALDAV_SERVER_URL: ${{ secrets.CALDAV_SERVER_URL }}
      CALDAV_USERNAME: ${{ secrets.CALDAV_USERNAME }}
      CALDAV_PASSWORD: ${{ secrets.CALDAV_PASSWORD }}
      CALDAV_CALENDAR_NAME: ${{ secrets.CALDAV_CALENDAR_NAME }}
      CALDAV_ORGANIZER_NAME: ${{ secrets.CALDAV_ORGANIZER_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Ensure required secrets exist
        shell: bash
        run: |
          if [[ -z "$CALDAV_SERVER_URL" || -z "$CALDAV_USERNAME" || -z "$CALDAV_PASSWORD" ]]; then
            echo "Smoke workflow skipped: required CalDAV secrets are not configured."
            exit 0
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke test CalDAV create -> update -> delete
        run: node .github/scripts/smoke-icloud.mjs
